name: Build & Deploy Bondbyte to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next.config.ts sets output: "standalone": a self-contained Node server
      # in .next/standalone. Content is read from DATA_DIR on the server at
      # request time, so nothing site-specific is baked in here.
      - name: Build
        run: npm run build

      # The standalone server serves public/ and .next/static only when they
      # sit next to it, and pm2 needs its process file in the release.
      - name: Assemble Release
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp deploy/ecosystem.config.cjs .next/standalone/
          test -f .next/standalone/server.js || { echo "!! server.js missing"; exit 1; }
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload Release to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "release.tar.gz"
          target: "/var/www/bondbyte/"

      # Each deploy unpacks into its own release folder and switches the
      # `current` symlink, so a failed upload never touches the running site.
      # The data folder (content, inquiries, uploads) is outside the releases
      # and is never touched by a deploy.
      #
      # The server's env file (admin login, session secret, SMTP) is written
      # from GitHub secrets on every deploy, so they are managed in one place:
      # Settings → Secrets and variables → Actions. Without ADMIN_PASSWORD the
      # file already on the server is used instead.
      - name: Publish on Server
        uses: appleboy/ssh-action@v1.2.0
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ADMIN_USERNAME,ADMIN_PASSWORD,TOKEN_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM_NAME,SMTP_FROM_EMAIL,CONTACT_TO_EMAIL
          script: |
            set -e
            cd /var/www/bondbyte

            command -v pm2 >/dev/null || { echo "!! pm2 is not installed on the server (see README: First-time server setup)"; exit 1; }
            mkdir -p releases data shared

            if [ -n "$ADMIN_PASSWORD" ]; then
              [ -n "$TOKEN_SECRET" ] || { echo "!! Add a TOKEN_SECRET secret in GitHub (Settings → Secrets and variables → Actions)"; exit 1; }
              umask 077
              {
                for name in ADMIN_USERNAME ADMIN_PASSWORD TOKEN_SECRET SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM_NAME SMTP_FROM_EMAIL CONTACT_TO_EMAIL; do
                  value="$(printenv "$name" || true)"
                  [ -n "$value" ] || continue
                  # Values are written single-quoted, so they cannot contain a quote or a line break.
                  if [ "$(printf '%s' "$value" | wc -l)" -ne 0 ] || [ "${value#*\'}" != "$value" ]; then
                    echo "!! The $name secret contains a ' or a line break, which the env file cannot hold" >&2; exit 1
                  fi
                  printf "%s='%s'\n" "$name" "$value"
                done
              } > shared/.env.new
              mv shared/.env.new shared/.env
              chmod 600 shared/.env
              echo "Wrote shared/.env from GitHub secrets"
            fi
            test -f shared/.env || { echo "!! No env file: add ADMIN_PASSWORD and TOKEN_SECRET secrets in GitHub (Settings → Secrets and variables → Actions), then re-run"; exit 1; }

            release="releases/$(date +%Y%m%d%H%M%S)-$(echo "${{ github.sha }}" | cut -c1-7)"
            mkdir -p "$release"
            tar -xzf release.tar.gz -C "$release"
            rm -f release.tar.gz
            test -f "$release/server.js" || { echo "!! bad upload"; rm -rf "$release"; exit 1; }

            # The port lives in one place: the ecosystem file of the release.
            port="$(node -p "require('./$release/ecosystem.config.cjs').apps[0].env.PORT")"
            previous="$(readlink current || true)"

            ln -sfn "$(pwd)/$release" current.new && mv -T current.new current

            # Recreated rather than reloaded, so port, env file and paths always
            # come from the new ecosystem file (fork mode restarts either way).
            pm2 delete bondbyte >/dev/null 2>&1 || true
            sleep 1
            if ss -ltn "( sport = :$port )" | grep -q LISTEN; then
              echo "!! Port $port is already used by another app on this server:"
              ss -ltnp "( sport = :$port )" || true
              echo "!! Choose a free PORT in deploy/ecosystem.config.cjs and in deploy/nginx-bondbyte.conf"
              exit 1
            fi
            pm2 start current/ecosystem.config.cjs

            # Done only when BondByte itself answers: the admin session endpoint
            # is ours, so another app on the same port cannot pass this check.
            healthy() { curl -fsS "http://127.0.0.1:$port/api/admin/session" 2>/dev/null | grep -q '"canSignIn"'; }
            for i in $(seq 1 30); do healthy && break; sleep 1; done
            if ! healthy; then
              echo "!! BondByte did not start on port $port"
              pm2 logs bondbyte --lines 60 --nostream || true
              if [ -n "$previous" ] && [ -d "$previous" ]; then
                echo "Rolling back to $previous"
                ln -sfn "$previous" current.new && mv -T current.new current
                pm2 delete bondbyte >/dev/null 2>&1 || true
                pm2 start current/ecosystem.config.cjs || true
              fi
              exit 1
            fi
            pm2 save

            # Keep the three newest releases for a quick rollback.
            ls -1dt releases/*/ | tail -n +4 | xargs -r rm -rf
            echo "Published $release"
