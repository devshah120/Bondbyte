name: Build & Deploy Bondbyte to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Static Site

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
      # so they must be present here rather than on the server.
      - name: Create .env.production
        run: |
          cat > .env.production <<EOF
          NEXT_PUBLIC_FORM_ENDPOINT=${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
          NEXT_PUBLIC_FORM_ACCESS_KEY=${{ secrets.NEXT_PUBLIC_FORM_ACCESS_KEY }}
          EOF

      - name: Install Dependencies
        run: npm ci

      # next.config.ts sets output: "export", so this emits a self-contained
      # static site into out/. Nothing runs on the server; nginx serves files.
      - name: Build Static Site
        run: npm run build

      - name: Verify export
        run: |
          test -f out/index.html || { echo "!! out/index.html missing"; exit 1; }
          echo "Exported $(find out -name '*.html' | wc -l) HTML files"

      # Archive the contents of out/, not the directory itself.
      - name: Archive Build
        run: tar -czf out.tar.gz -C out .

      - name: Upload Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "out.tar.gz"
          target: "/var/www/bondbyte/"

      # Only the docroot is replaced. Source files and node_modules on the
      # server are never touched, so a deploy cannot break the checkout.
      - name: Publish on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/bondbyte

            rm -rf out.new && mkdir out.new
            tar -xzf out.tar.gz -C out.new
            rm -f out.tar.gz

            test -f out.new/index.html || { echo "!! bad upload"; exit 1; }

            # Swap atomically so visitors never see a half-written docroot.
            rm -rf out.old
            [ -d out ] && mv out out.old
            mv out.new out
            rm -rf out.old

            echo "Published $(find out -name '*.html' | wc -l) HTML files"
