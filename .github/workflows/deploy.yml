name: Build & Deploy Bondbyte to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next.config.ts sets output: "standalone": a self-contained Node server
      # in .next/standalone. Content is read from DATA_DIR on the server at
      # request time, so nothing site-specific is baked in here.
      - name: Build
        run: npm run build

      # The standalone server serves public/ and .next/static only when they
      # sit next to it, and pm2 needs its process file in the release.
      - name: Assemble Release
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp deploy/ecosystem.config.cjs .next/standalone/
          test -f .next/standalone/server.js || { echo "!! server.js missing"; exit 1; }
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload Release to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "release.tar.gz"
          target: "/var/www/bondbyte/"

      # Each deploy unpacks into its own release folder and switches the
      # `current` symlink, so a failed upload never touches the running site.
      # The data folder (content, inquiries, uploads) is outside the releases
      # and is never touched by a deploy.
      - name: Publish on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/bondbyte

            command -v pm2 >/dev/null || { echo "!! pm2 is not installed on the server (see README: First-time server setup)"; exit 1; }
            test -f shared/.env || { echo "!! /var/www/bondbyte/shared/.env is missing (see README)"; exit 1; }
            mkdir -p releases data

            release="releases/$(date +%Y%m%d%H%M%S)-$(echo "${{ github.sha }}" | cut -c1-7)"
            mkdir -p "$release"
            tar -xzf release.tar.gz -C "$release"
            rm -f release.tar.gz
            test -f "$release/server.js" || { echo "!! bad upload"; rm -rf "$release"; exit 1; }

            ln -sfn "$(pwd)/$release" current.new && mv -T current.new current
            pm2 startOrReload current/ecosystem.config.cjs --update-env
            pm2 save

            # Wait for the new server to answer before calling it done.
            for i in $(seq 1 20); do
              curl -fsS -o /dev/null http://127.0.0.1:3000/robots.txt && break
              sleep 1
            done
            curl -fsS -o /dev/null http://127.0.0.1:3000/robots.txt || { echo "!! server did not start"; pm2 logs bondbyte --lines 40 --nostream; exit 1; }

            # Keep the three newest releases for a quick rollback.
            ls -1dt releases/*/ | tail -n +4 | xargs -r rm -rf
            echo "Published $release"
