server {
    listen 80;
    listen [::]:80;
    server_name bondbyte.in www.bondbyte.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bondbyte.in www.bondbyte.in;

    ssl_certificate     /etc/letsencrypt/live/bondbyte.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bondbyte.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/bondbyte/out;
    index index.html;

    access_log /var/log/nginx/bondbyte.access.log;
    error_log  /var/log/nginx/bondbyte.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
