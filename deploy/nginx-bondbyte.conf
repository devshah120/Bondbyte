server {
    listen 80;
    listen [::]:80;
    server_name bondbyte.in www.bondbyte.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bondbyte.in www.bondbyte.in;

    ssl_certificate     /etc/letsencrypt/live/bondbyte.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bondbyte.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bondbyte.access.log;
    error_log  /var/log/nginx/bondbyte.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Media library uploads go through the Node server; the app accepts up to
    # MAX_UPLOAD_MB (10 MB by default), so allow a little more here.
    client_max_body_size 12m;

    # Fingerprinted build assets never change: serve them straight from disk.
    location /_next/static/ {
        alias /var/www/bondbyte/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else — pages, /admin, /api, /uploads — is the Next.js server
    # run by pm2 (deploy/ecosystem.config.cjs).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app reads X-Real-IP for its sign in and contact form limits.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
